name: Flutter checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install packages
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Flutter tests (if present)
        run: |
          if [ -d test ]; then flutter test; else echo 'No test directory'; fi
      - name: Python server syntax
        run: python -m py_compile cloud_run/main.py
