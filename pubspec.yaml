name: hyojason_app
description: "효자손 보호자용 돌봄 앱 시제품"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png

  # 잘난체 파일은 공식 사이트에서 직접 내려받은 뒤 아래 주석을 해제하세요.
  # 파일명은 assets/fonts/Jalnan.ttf, assets/fonts/JalnanGothic.ttf 로 맞추면 됩니다.
  # fonts:
  #   - family: Jalnan
  #     fonts:
  #       - asset: assets/fonts/Jalnan.ttf
  #   - family: JalnanGothic
  #     fonts:
  #       - asset: assets/fonts/JalnanGothic.ttf
